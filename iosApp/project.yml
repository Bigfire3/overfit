# XcodeGen spec for the iOS shell. Generate the Xcode project with:
#   brew install xcodegen && cd iosApp && xcodegen
# The generated Overfit.xcodeproj is not checked in (see .gitignore).
name: Overfit
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Guthaben/Einladungs backend URL, passed by CI (xcodebuild OVERFIT_BACKEND_URL=…); empty = not configured.
    OVERFIT_BACKEND_URL: ""
    # Kotlin builds only iosArm64 and iosSimulatorArm64 (no Intel simulator).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  Overfit:
    type: application
    platform: iOS
    sources:
      - path: Overfit
    info:
      path: Overfit/Info.plist
      properties:
        CFBundleDisplayName: overfit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OverfitBackendUrl: $(OVERFIT_BACKEND_URL)
        # Launch screen: black with a small white "of" (assets generated by tools/icon/build_icon.py).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Only HTTPS, which is exempt from export compliance.
        ITSAppUsesNonExemptEncryption: false
        # Compose Multiplatform: allow 120 Hz on ProMotion devices.
        CADisableMinimumFrameDurationOnPhone: true
        # Body photos after a workout (stored only inside the app, never in the photo library).
        NSCameraUsageDescription: Overfit nutzt die Kamera für Fortschrittsfotos nach dem Training (sie bleiben in der App) und zum Scannen geteilter Workout-QR-Codes. / Overfit uses the camera for progress photos after a workout (they stay inside the app) and to scan shared workout QR codes.
        NSPhotoLibraryUsageDescription: Overfit übernimmt auf Wunsch ein Foto als Fortschrittsfoto. / Overfit can use a photo of your choice as a progress photo.
        # overfit://t#… opens the import screen.
        CFBundleURLTypes:
          - CFBundleURLName: app.overfit
            CFBundleURLSchemes: [overfit]
        # .overfit files (shared workouts) open in Overfit.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.overfit.training
            UTTypeDescription: Overfit Training
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [overfit]
              public.mime-type: [application/x-overfit]
        # Files from Files/WhatsApp/Mail are copied into the app (no in-place editing needed).
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Overfit Training
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [app.overfit.training]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.overfit
        # App icon "of" (Assets.xcassets/AppIcon, light/dark/tinted), generated by tools/icon/build_icon.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only for the first release.
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  # UI tests (XCUITest): smoke flow and screenshots, run by .github/workflows/ios.yml in the simulator.
  OverfitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OverfitUITests
    dependencies:
      - target: Overfit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.overfit.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Overfit
schemes:
  Overfit:
    build:
      targets:
        Overfit: all
        OverfitUITests: [test]
    test:
      targets:
        - OverfitUITests

# XcodeGen spec for the iOS shell. Generate the Xcode project with:
#   brew install xcodegen && cd iosApp && xcodegen
# The generated Overfit.xcodeproj is not checked in (see .gitignore).
name: Overfit
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Fuel/Spot backend URL, passed by CI (xcodebuild OVERFIT_BACKEND_URL=…); empty = not configured.
    OVERFIT_BACKEND_URL: ""
targets:
  Overfit:
    type: application
    platform: iOS
    sources:
      - path: Overfit
    info:
      path: Overfit/Info.plist
      properties:
        CFBundleDisplayName: Overfit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OverfitBackendUrl: $(OVERFIT_BACKEND_URL)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Only HTTPS, which is exempt from export compliance.
        ITSAppUsesNonExemptEncryption: false
        # Compose Multiplatform: allow 120 Hz on ProMotion devices.
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.overfit
        # iPhone only for the first release.
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

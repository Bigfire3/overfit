name: Android CI

on:
  push:
    branches: [main, 'claude/**', 'ccr-*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Android SDK-Pakete installieren
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Robolectric-Cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

      - name: Tests
        run: ./gradlew :shared:testAndroidHostTest :app:testDebugUnitTest --console=plain

      # Ersatz für die pausierte iOS-CI: iosMain kompiliert unter Linux (nur Klibs, kein Linken).
      - name: iOS-Code kompilieren (Kotlin/Native)
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --console=plain

      - name: Signaturschlüssel aus Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.OVERFIT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OVERFIT_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets OVERFIT_KEYSTORE_BASE64 / OVERFIT_KEYSTORE_PASSWORD fehlen (README, Abschnitt Signatur)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/overfit-release.p12"
          echo "OVERFIT_KEYSTORE_FILE=$RUNNER_TEMP/overfit-release.p12" >> "$GITHUB_ENV"

      - name: Signiertes Release-APK und App Bundle (Google Play)
        env:
          OVERFIT_KEYSTORE_PASSWORD: ${{ secrets.OVERFIT_KEYSTORE_PASSWORD }}
          # Fuel/Spot backend URL (Repository-Variable, optional; leer = "startet bald" in der App)
          OVERFIT_BACKEND_URL: ${{ vars.OVERFIT_BACKEND_URL }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --console=plain

      - name: APK vorbereiten
        id: apk
        run: |
          rm -f "$RUNNER_TEMP/overfit-release.p12"
          cp app/build/outputs/apk/release/app-release.apk overfit.apk
          cp app/build/outputs/bundle/release/app-release.aab overfit.aab
          echo "version_name=$(grep -oP '"versionName": "\K[^"]+' app/build/outputs/apk/release/output-metadata.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: overfit-${{ github.run_number }}
          path: |
            overfit.apk
            overfit.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/tests/
            shared/build/reports/tests/
          if-no-files-found: ignore

      - name: Testberichte bei Fehler
        if: failure()
        run: |
          find app/build/test-results shared/build/test-results -name '*.xml' -exec grep -l '<failure' {} + 2>/dev/null \
            | xargs -r head -c 4000 || true

    outputs:
      version_name: ${{ steps.apk.outputs.version_name }}

  release:
    needs: build
    # Nur main und Versions-Tags veröffentlichen. Andere Branches bauen und testen nur,
    # ihr APK liegt als Actions-Artefakt bereit, "latest" bleibt unberührt.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Immer nur ein Release-Update gleichzeitig, damit "latest" konsistent bleibt.
    concurrency:
      group: release-latest
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_NAME: ${{ needs.build.outputs.version_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: overfit-${{ github.run_number }}

      - name: Pre-Release "latest" aktualisieren
        run: |
          NOTES="Automatischer Build ${VERSION_NAME} (versionCode ${GITHUB_RUN_NUMBER})
          Branch: ${GITHUB_REF_NAME} · Commit: ${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M UTC')

          Installation: overfit.apk unten unter Assets antippen und öffnen. Details im README."
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --prerelease --title "Overfit latest (${VERSION_NAME})" --notes "$NOTES"
            gh release upload latest overfit.apk --clobber
          else
            gh release create latest overfit.apk --prerelease --verify-tag \
              --title "Overfit latest (${VERSION_NAME})" --notes "$NOTES"
          fi

      - name: Versioniertes Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp overfit.apk "overfit-${GITHUB_REF_NAME}.apk"
          cp overfit.aab "overfit-${GITHUB_REF_NAME}.aab"
          gh release create "$GITHUB_REF_NAME" "overfit-${GITHUB_REF_NAME}.apk" "overfit-${GITHUB_REF_NAME}.aab" \
            --title "Overfit ${GITHUB_REF_NAME}" --generate-notes --verify-tag

name: Backend deployen

# Deploy-Knopf für das Cloudflare-Backend (Fuel, Spot, KI-Chat): Actions → „Backend deployen“ → Run workflow.
# Anleitung im Browser: backend/README.md → „Deployment ohne Terminal“.
# Alles ist idempotent: D1-Datenbank und R2-Bucket werden nur angelegt, wenn sie fehlen; Migrationen laufen nur, wenn neu.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Betrieb: test (Testserver, keine Geräteprüfung, Test-Guthaben) oder production (echt, mit Store-Prüfung)'
        type: choice
        options: [test, production]
        default: test
      credit_eur:
        description: 'Nur test: Test-Guthaben in € allen Konten gutschreiben (0 = nichts; höchstens 10 € je Lauf)'
        type: string
        default: '0'
  # Automatisch nach Änderungen am Backend, aber nur wenn die Repo-Variable BACKEND_DEPLOY_MODE (test | production)
  # gesetzt ist und die Cloudflare-Secrets existieren. Sonst passiert nichts.
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-deploy.yml']

concurrency:
  group: backend-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MODE: ${{ inputs.mode || vars.BACKEND_DEPLOY_MODE }}
      EVENT: ${{ github.event_name }}
      CURRENT_URL: ${{ vars.OVERFIT_BACKEND_URL }}
      # Worker-Secrets (alle optional bis auf ANTHROPIC_API_KEY; Details in backend/README.md)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SPOT_SIGNING_KEY: ${{ secrets.SPOT_SIGNING_KEY }}
      SYNC_ENCRYPTION_KEY: ${{ secrets.SYNC_ENCRYPTION_KEY }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
      GOOGLE_PLAY_PACKAGE_NAME: ${{ secrets.GOOGLE_PLAY_PACKAGE_NAME }}
      PLAY_INTEGRITY_SERVICE_ACCOUNT: ${{ secrets.PLAY_INTEGRITY_SERVICE_ACCOUNT }}
      APPLE_IAP_KEY: ${{ secrets.APPLE_IAP_KEY }}
      APPLE_IAP_KEY_ID: ${{ secrets.APPLE_IAP_KEY_ID }}
      APPLE_IAP_ISSUER_ID: ${{ secrets.APPLE_IAP_ISSUER_ID }}
      APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
      APPLE_APP_ATTEST_TEAM_ID: ${{ secrets.APPLE_APP_ATTEST_TEAM_ID }}
    steps:
      - name: Voraussetzungen prüfen
        id: pre
        # Läuft vor dem Checkout: backend/ existiert hier noch nicht.
        working-directory: .
        run: |
          set -u
          SUMMARY="$GITHUB_STEP_SUMMARY"
          if [ "$EVENT" = "push" ] && [ -z "$MODE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Kein automatisches Deploy: Repo-Variable BACKEND_DEPLOY_MODE ist nicht gesetzt." | tee -a "$SUMMARY"
            exit 0
          fi
          if [ "$MODE" != "test" ] && [ "$MODE" != "production" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::error::Ungültiger Modus '$MODE' (erlaubt: test, production)."
            exit 1
          fi
          MISSING=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && MISSING="$MISSING CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$MISSING" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            if [ "$EVENT" = "push" ]; then
              echo "Kein automatisches Deploy: Cloudflare-Secrets fehlen ($MISSING)." | tee -a "$SUMMARY"
              exit 0
            fi
            {
              echo "### ❌ Cloudflare-Zugang fehlt"
              echo
              echo "Es fehlen die GitHub-Secrets:$MISSING"
              echo
              echo "1. **CLOUDFLARE_ACCOUNT_ID**: dash.cloudflare.com → in der linken Leiste „Workers & Pages“ → rechts steht „Account ID“ (Kopieren-Symbol)."
              echo "2. **CLOUDFLARE_API_TOKEN**: dash.cloudflare.com → Profil (oben rechts) → My Profile → API Tokens → Create Token → „Create Custom Token“ mit den Rechten"
              echo "   *Account · Workers Scripts · Edit*, *Account · D1 · Edit*, *Account · Workers R2 Storage · Edit*, *Account · Account Settings · Read*"
              echo "   (Account Resources: dein Konto) → Continue → Create Token → Wert kopieren."
              echo "3. GitHub → Settings → Secrets and variables → Actions → New repository secret (Name exakt wie oben)."
              echo
              echo "Danach den Workflow erneut starten. Die ganze Anleitung steht in backend/README.md."
            } | tee -a "$SUMMARY"
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "## Backend deployen · Modus: **$MODE**" >> "$SUMMARY"
          echo >> "$SUMMARY"

      - uses: actions/checkout@v7
        if: steps.pre.outputs.run == 'true'
      - uses: actions/setup-node@v6
        if: steps.pre.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Abhängigkeiten, Typprüfung, Tests
        if: steps.pre.outputs.run == 'true'
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Namen für diesen Modus
        if: steps.pre.outputs.run == 'true'
        id: names
        run: |
          N=$(node scripts/deploy-config.mjs names "$MODE")
          echo "worker=$(echo "$N" | jq -r .worker)" >> "$GITHUB_OUTPUT"
          echo "db=$(echo "$N" | jq -r .db)" >> "$GITHUB_OUTPUT"
          echo "bucket=$(echo "$N" | jq -r .bucket)" >> "$GITHUB_OUTPUT"

      - name: D1-Datenbank anlegen, falls sie fehlt
        if: steps.pre.outputs.run == 'true'
        id: d1
        env:
          DB: ${{ steps.names.outputs.db }}
        run: |
          find_id() { npx wrangler d1 list --json | jq -r --arg n "$DB" '[.[] | select(.name == $n)][0].uuid // empty'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            echo "Datenbank $DB fehlt, lege sie an."
            OUT=$(npx wrangler d1 create "$DB" 2>&1) || { echo "$OUT" | grep -qi "already exists" || { echo "$OUT"; exit 1; }; }
            ID=$(find_id)
          fi
          [ -n "$ID" ] || { echo "::error::Datenbank-ID von $DB nicht gefunden (Token-Recht „D1 · Edit“ vorhanden?)"; exit 1; }
          echo "::add-mask::$ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: R2-Bucket anlegen, falls er fehlt
        if: steps.pre.outputs.run == 'true'
        env:
          BUCKET: ${{ steps.names.outputs.bucket }}
        run: |
          OUT=$(npx wrangler r2 bucket create "$BUCKET" 2>&1) && echo "Bucket $BUCKET angelegt." || {
            if echo "$OUT" | grep -qi "already exists"; then echo "Bucket $BUCKET gibt es schon."; else
              echo "$OUT"
              echo "::error::R2-Bucket konnte nicht angelegt werden. R2 muss einmalig im Cloudflare-Dashboard aktiviert sein (dash.cloudflare.com → R2 Object Storage → Free-Tarif wählen) und der Token braucht „Workers R2 Storage · Edit“."
              exit 1
            fi
          }

      - name: Konfiguration erzeugen (Datenbank-ID nur zur Laufzeit)
        if: steps.pre.outputs.run == 'true'
        run: node scripts/deploy-config.mjs config "$MODE" "${{ steps.d1.outputs.id }}"

      - name: Migrationen anwenden
        if: steps.pre.outputs.run == 'true'
        env:
          DB: ${{ steps.names.outputs.db }}
        run: npx wrangler d1 migrations apply "$DB" --remote -c wrangler.generated.jsonc

      - name: Deployen
        if: steps.pre.outputs.run == 'true'
        id: deploy
        run: |
          npx wrangler deploy -c wrangler.generated.jsonc 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 || true)
          if [ -z "$URL" ]; then
            {
              echo "### ❌ Keine Worker-Adresse gefunden"
              echo
              echo "Meist fehlt die workers.dev-Subdomain deines Kontos: dash.cloudflare.com → Workers & Pages → rechts „Subdomain“ bzw. „Your subdomain“ → einen Namen wählen. Danach den Workflow erneut starten."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Worker-Secrets übertragen
        if: steps.pre.outputs.run == 'true'
        run: |
          npx wrangler secret list --format json -c wrangler.generated.jsonc > "$RUNNER_TEMP/existing.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/existing.json"
          node scripts/deploy-secrets.mjs "$MODE" "$RUNNER_TEMP/existing.json" "$RUNNER_TEMP/secrets.json" "$GITHUB_STEP_SUMMARY"
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json" -c wrangler.generated.jsonc
          if [ -f "$RUNNER_TEMP/secrets.json.admin" ]; then echo "ADMIN_SECRET_FILE=$RUNNER_TEMP/secrets.json.admin" >> "$GITHUB_ENV"; fi
          rm -f "$RUNNER_TEMP/secrets.json"

      - name: Gesundheitsprüfung (/v1/health, /v1/config)
        if: steps.pre.outputs.run == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$URL/v1/health" | jq -e '.ok == true' >/dev/null 2>&1; then OK=1; break; fi
            echo "Worker antwortet noch nicht ($i/30) …"; sleep 4
          done
          [ "${OK:-0}" = 1 ] || { echo "::error::$URL/v1/health antwortet nicht"; exit 1; }
          CFG=$(curl -fsS "$URL/v1/config")
          echo "$CFG" | jq -e --arg m "$MODE" '.mode == $m and (.packages | length) > 0' >/dev/null || { echo "::error::/v1/config passt nicht zum Modus $MODE: $CFG"; exit 1; }
          echo "Health und Config in Ordnung (mode=$MODE)."

      - name: Test-Guthaben gutschreiben
        if: steps.pre.outputs.run == 'true' && inputs.mode == 'test' && inputs.credit_eur != '' && inputs.credit_eur != '0'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          CREDIT_EUR: ${{ inputs.credit_eur }}
        run: |
          MICRO=$(awk -v e="$CREDIT_EUR" 'BEGIN { if (e !~ /^[0-9]+([.][0-9]+)?$/ || e + 0 > 10) exit 1; printf "%d", e * 1000000 }') || { echo "::error::credit_eur muss eine Zahl bis 10 sein"; exit 1; }
          [ -n "${ADMIN_SECRET_FILE:-}" ] || { echo "::error::Kein ADMIN_SECRET vorhanden"; exit 1; }
          RES=$(curl -sS -w '\n%{http_code}' -X POST "$URL/v1/admin/credit" \
            -H "authorization: Bearer $(cat "$ADMIN_SECRET_FILE")" -H 'content-type: application/json' \
            -d "{\"amountMicro\": $MICRO, \"all\": true}")
          CODE=$(echo "$RES" | tail -1); BODY=$(echo "$RES" | head -n -1)
          [ "$CODE" = 200 ] || { echo "::error::Gutschrift fehlgeschlagen ($CODE): $BODY"; exit 1; }
          {
            echo "### Test-Guthaben"
            echo
            echo "$CREDIT_EUR € auf alle bestehenden Konten gebucht: $(echo "$BODY" | jq -r '"\(.credited) von \(.accounts) Konten, zusammen \(.totalMicro / 1000000) € (Obergrenze insgesamt \(.capMicro / 1000000) €)"')."
            echo "Die Konten entstehen, sobald die App zum ersten Mal Fuel öffnet (neue Konten bekommen 1 € automatisch)."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Zusammenfassung mit Worker-Adresse
        if: steps.pre.outputs.run == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### ✅ Backend läuft"
            echo
            echo "Worker-Adresse (Modus **$MODE**):"
            echo
            echo '```'
            echo "$URL"
            echo '```'
            echo
            if [ "$CURRENT_URL" = "$URL" ]; then
              echo "Die Repo-Variable \`OVERFIT_BACKEND_URL\` steht schon auf diese Adresse. Nichts weiter zu tun."
            else
              echo "**Letzter Schritt (einmalig, ein Feld):** GitHub kann diese Variable aus einem Workflow heraus nicht selbst setzen"
              echo "(dafür bräuchte es ein zusätzliches persönliches Zugriffstoken). Bitte so eintragen:"
              echo
              echo "1. [Settings → Secrets and variables → Actions → Variables](https://github.com/$REPO/settings/variables/actions)"
              echo "2. \`OVERFIT_BACKEND_URL\` anlegen (bzw. bearbeiten, wenn es sie schon gibt) und die Adresse oben einfügen (ohne Schrägstrich am Ende)."
              echo "3. Den nächsten App-Build abwarten: Actions → \`Android\` läuft nach jedem Merge nach main von allein; oder dort „Run workflow“. Danach das neue APK aus „Overfit latest“ installieren."
            fi
            echo
            if [ "$MODE" = "test" ]; then
              echo "**Testbetrieb:** keine Geräteprüfung, neue Konten bekommen 1 € Test-Guthaben, niedrige Limits, die App zeigt „Testserver“ unter Fuel. Mehr Test-Guthaben: diesen Workflow mit \`credit_eur\` starten."
              echo "Für den echten Betrieb später mit \`mode = production\` deployen (eigener Worker und eigene Datenbank, die Adresse ändert sich dann)."
            else
              echo "**Produktion:** Käufe und Spot-Geräteprüfung brauchen die Store-Prüfer (Play/Apple), solange sind Käufe und Spot hier abgeschaltet (siehe backend/README.md)."
            fi
            echo
            echo "Beim nächsten Mal dauert dieser Lauf kürzer: Datenbank und Bucket sind da, nur Migrationen und Code werden aktualisiert."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hinweis bei Fehler
        if: failure() && steps.pre.outputs.run == 'true'
        run: |
          {
            echo
            echo "### Hilfe bei Fehlern"
            echo
            echo "- \`Authentication error\` / \`10000\`: Der API-Token hat nicht alle Rechte (Workers Scripts Edit, D1 Edit, Workers R2 Storage Edit, Account Settings Read) oder gehört zu einem anderen Konto."
            echo "- \`workers.dev subdomain\`: Subdomain im Dashboard wählen (Workers & Pages)."
            echo "- R2: einmalig im Dashboard unter „R2 Object Storage“ aktivieren (Free-Tarif)."
            echo "- Der Lauf ist wiederholbar: bereits Angelegtes wird übersprungen."
          } >> "$GITHUB_STEP_SUMMARY"

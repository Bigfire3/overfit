name: iOS CI

# Pausiert (3.11.): macOS-Minuten kosten 10x und haben die meisten Actions-Kosten verursacht.
# Läuft nur noch von Hand (Actions → iOS CI → Run workflow), z. B. vor einem Release oder
# nach größeren Änderungen an iosMain/iosApp. Kotlin/Native-Code prüft weiterhin
# :shared:compileKotlinIosSimulatorArm64 in der Android-CI bzw. lokal.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    concurrency:
      group: ios-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Kotlin/Native-Tests im iOS-Simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --console=plain

      - name: Xcode-Projekt erzeugen
        run: |
          brew install xcodegen
          cd iosApp && xcodegen

      - name: App für den Simulator bauen
        env:
          # Fuel/Spot backend URL (Repository-Variable, optional)
          OVERFIT_BACKEND_URL: ${{ vars.OVERFIT_BACKEND_URL }}
        run: |
          xcodebuild -project iosApp/Overfit.xcodeproj -scheme Overfit -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO OVERFIT_BACKEND_URL="$OVERFIT_BACKEND_URL" build | tail -n 60

name: iOS CI

# Repo ist öffentlich, macOS-Runner sind damit kostenlos. iOS baut für PRs nach main,
# Pushes auf main und auf Anforderung – nicht bei jedem Push auf einen Session-Branch.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    concurrency:
      group: ios-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Kotlin/Native-Tests im iOS-Simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --console=plain

      - name: Xcode-Projekt erzeugen
        run: |
          brew install xcodegen
          cd iosApp && xcodegen

      - name: App für den Simulator bauen
        env:
          # Guthaben/Einladungs backend URL (Repository-Variable, optional)
          OVERFIT_BACKEND_URL: ${{ vars.OVERFIT_BACKEND_URL }}
        run: |
          set -o pipefail
          xcodebuild -project iosApp/Overfit.xcodeproj -scheme Overfit -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO OVERFIT_BACKEND_URL="$OVERFIT_BACKEND_URL" build | tail -n 60

      # The newest iPhone with Dynamic Island on the newest iOS runtime of the runner.
      # Booting a simulator on a shared runner sometimes hangs (bootstatus never finishes, then the device is gone
      # for xcodebuild). So: every attempt has a timeout, a failed one shuts the device down and erases it, the last
      # one creates a fresh device; and the device must be "Booted" before it is handed on.
      - name: Simulator wählen und starten
        id: sim
        run: |
          set -u
          IFS=$'\t' read -r UDID NAME DEVICETYPE RUNTIME < <(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          def ver(rt): return [int(x) for x in rt.split("iOS-")[-1].split("-") if x.isdigit()]
          runtimes = sorted((rt for rt in data if "iOS" in rt and data[rt]), key=ver, reverse=True)
          for rt in runtimes:
              phones = [d for d in data[rt] if d["name"].startswith("iPhone") and " Pro" in d["name"] and "Max" not in d["name"]]
              phones = phones or [d for d in data[rt] if d["name"].startswith("iPhone")]
              if phones:
                  phones.sort(key=lambda d: d["name"], reverse=True)
                  p = phones[0]
                  print("\t".join([p["udid"], p["name"], p.get("deviceTypeIdentifier", ""), rt]))
                  break
          ')
          echo "Gewählt: $NAME ($UDID), Runtime $RUNTIME"

          is_booted() { xcrun simctl list devices | grep "$UDID" | grep -q "(Booted)"; }
          # No `timeout` on macOS runners: perl's alarm ends the command after N seconds.
          with_timeout() { local secs=$1; shift; perl -e 'alarm shift; exec @ARGV' "$secs" "$@"; }

          for attempt in 1 2 3; do
            echo "::group::Boot-Versuch $attempt"
            if [ "$attempt" -gt 1 ]; then
              echo "Vorheriger Versuch fehlgeschlagen: Simulatoren herunterfahren, Gerät zurücksetzen"
              xcrun simctl shutdown all || true
              if [ "$attempt" -eq 2 ]; then
                xcrun simctl erase "$UDID" || true
              else
                # Last attempt: a fresh device (the old one may be stuck for good).
                xcrun simctl delete "$UDID" || true
                if [ -n "$DEVICETYPE" ]; then
                  NEW=$(xcrun simctl create "$NAME" "$DEVICETYPE" "$RUNTIME") && UDID=$NEW
                fi
                echo "Neues Gerät: $UDID"
              fi
              sleep 5
            fi
            xcrun simctl boot "$UDID" || true
            if with_timeout 240 xcrun simctl bootstatus "$UDID" -b && is_booted; then
              echo "::endgroup::"
              break
            fi
            echo "Boot-Versuch $attempt nicht erfolgreich (Timeout oder Fehler)"
            xcrun simctl list devices | grep "$UDID" || true
            echo "::endgroup::"
          done

          if ! is_booted; then
            echo "::error::Simulator $UDID ist nach 3 Boot-Versuchen nicht gestartet"
            xcrun simctl list devices
            exit 1
          fi
          xcrun simctl list devices | grep "$UDID"
          # Clean status bar for the screenshots.
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # XCUITest: smoke flow (start, tick a set, minimize, finish, relaunch) and screenshots in light/dark.
      - name: UI-Tests im Simulator (Smoke-Flow, Screenshots)
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/ios-screenshots
        run: |
          set -o pipefail
          # The simulator must still be booted (xcodebuild would otherwise fail with "Unable to find a device").
          xcrun simctl list devices | grep "${{ steps.sim.outputs.udid }}" | grep -q "(Booted)" || { echo "::error::Simulator nicht gebootet"; xcrun simctl list devices; exit 1; }
          xcodebuild -project iosApp/Overfit.xcodeproj -scheme Overfit -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -resultBundlePath ios-ui-tests.xcresult \
            OVERFIT_BACKEND_URL="" test 2>&1 | grep -E "Test Case|error:|failed|passed|XCTAssert|Nicht gefunden" | tail -n 80

      - name: Screenshots aus dem Testergebnis holen
        if: always()
        run: |
          mkdir -p ios-screenshots/attachments
          xcrun xcresulttool export attachments --path ios-ui-tests.xcresult --output-path ios-screenshots/attachments || true
          ls ios-screenshots ios-screenshots/attachments | head -n 80

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-screenshots
          path: |
            ios-screenshots
            ios-ui-tests.xcresult
          retention-days: 14

name: iOS TestFlight

# Manual: Actions → "iOS TestFlight" → Run workflow. Builds a signed archive and uploads it to
# App Store Connect (TestFlight). Setup for Fabian: README.md → "iPhone: TestFlight".
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   APP_STORE_CONNECT_KEY_ID      Key ID of the App Store Connect API key (10 characters)
#   APP_STORE_CONNECT_ISSUER_ID   Issuer ID (UUID above the key list)
#   APP_STORE_CONNECT_KEY_P8      Content of the AuthKey_XXXXXXXXXX.p8 file (incl. BEGIN/END lines)
#   APPLE_TEAM_ID                 Team ID (10 characters, developer.apple.com → Membership)
# Variables (same page, tab "Variables", optional):
#   IOS_BUNDLE_ID                 Bundle ID, default app.overfit
#   OVERFIT_BACKEND_URL           Fuel/Spot backend, like the Android build
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 90
    concurrency:
      group: ios-testflight
      cancel-in-progress: false
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'app.overfit' }}
      OVERFIT_BACKEND_URL: ${{ vars.OVERFIT_BACKEND_URL }}
    steps:
      - name: Secrets prüfen
        run: |
          missing=""
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$KEY_P8" ] || missing="$missing APP_STORE_CONNECT_KEY_P8"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            {
              echo "## TestFlight ist noch nicht eingerichtet"
              echo
              echo "Es fehlen die Repository-Secrets:**$missing**"
              echo
              echo "1. Apple Developer Program (99 €/Jahr) und App-Store-Connect-Eintrag mit Bundle-ID \`$BUNDLE_ID\` anlegen."
              echo "2. App Store Connect → Benutzer und Zugriff → Integrationen → App Store Connect API → Team-Schlüssel erzeugen (Rolle Admin), .p8 laden."
              echo "3. GitHub → Settings → Secrets and variables → Actions → New repository secret: die vier Namen oben."
              echo
              echo "Die ausführliche Anleitung steht in der README unter „iPhone: TestFlight“."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=TestFlight nicht eingerichtet::Fehlende Secrets:$missing. Anleitung: README.md → „iPhone: TestFlight“ (auch in der Zusammenfassung dieses Laufs)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Xcode-Projekt erzeugen
        run: |
          brew install xcodegen
          cd iosApp && xcodegen

      - name: API-Schlüssel ablegen
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      # Automatic signing: with -allowProvisioningUpdates and the API key, Xcode registers the App ID,
      # creates the (cloud-managed) distribution certificate and the provisioning profile itself.
      - name: Archiv bauen (Build-Nummer = Run-Nummer)
        run: |
          set -o pipefail
          xcodebuild archive -project iosApp/Overfit.xcodeproj -scheme Overfit -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Overfit.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" OVERFIT_BACKEND_URL="$OVERFIT_BACKEND_URL" \
            | grep -E "error|warning: .*sign|ARCHIVE" | tail -n 80

      - name: IPA exportieren und zu TestFlight hochladen
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Overfit.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tail -n 40
          {
            echo "## Hochgeladen"
            echo "Build ${{ github.run_number }} ist bei App Store Connect. Nach der Verarbeitung (meist 5–30 Minuten) erscheint er in TestFlight bei den internen Testern."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Schlüssel entfernen
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

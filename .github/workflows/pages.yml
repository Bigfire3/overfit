name: Web veröffentlichen (GitHub Pages)

# Veröffentlicht web/ nach https://bigfire3.github.io/overfit/ (Einmalig nötig: Settings → Pages → Source „GitHub Actions“).
# Nach einer Änderung der Repo-Variable OVERFIT_BACKEND_URL einmal von Hand starten (Run workflow), damit die Kaufseite
# /guthaben/ die neue Backend-Adresse kennt.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Seite zusammenstellen (Inter aus der App, OFL)
        env:
          # Kaufseite /guthaben/: Backend-Adresse aus derselben Repo-Variable wie die App (leer = Seite meldet „nicht eingerichtet“).
          BACKEND_URL: ${{ vars.OVERFIT_BACKEND_URL }}
        run: |
          mkdir -p _site/fonts
          cp -r web/index.html web/style.css web/t web/guthaben web/favicon.svg web/favicon.ico web/apple-touch-icon.png web/icon-192.png web/icon-512.png web/.nojekyll _site/
          URL=$(printf '%s' "$BACKEND_URL" | tr -d '[:space:]' | sed 's#/*$##')
          if ! printf '%s' "$URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?$'; then URL=""; fi
          printf "window.OVERFIT_API = '%s';\n" "$URL" > _site/guthaben/config.js
          echo "Kaufseite: Backend = ${URL:-(nicht gesetzt)}" 
          cp shared/src/commonMain/composeResources/font/inter_regular.ttf shared/src/commonMain/composeResources/font/inter_semibold.ttf _site/fonts/
          cp licenses/Inter-OFL.txt _site/fonts/OFL.txt
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
